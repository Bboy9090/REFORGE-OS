<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- REFORGE OS App Icon - Bronx Night Theme -->
  <!-- Neon Cyan (#2DD4FF) + Magenta (#FF3DBB) on Dark Background -->
  
  <defs>
    <linearGradient id="cyanGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2DD4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0EA5E9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="magentaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF3DBB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="64" cy="64" r="60" fill="#0F1114" stroke="#161A1F" stroke-width="2"/>
  
  <!-- Shield/Analysis Symbol (Cyan) -->
  <path d="M 64 20 L 90 30 L 90 55 Q 90 75 80 85 Q 70 95 64 100 Q 58 95 48 85 Q 38 75 38 55 L 38 30 Z" 
        fill="url(#cyanGradient)" 
        opacity="0.9"
        filter="url(#glow)"/>
  
  <!-- Inner Circuit/Grid Pattern (Magenta accents) -->
  <circle cx="64" cy="64" r="25" fill="none" stroke="url(#magentaGradient)" stroke-width="2" opacity="0.6"/>
  <line x1="64" y1="39" x2="64" y2="89" stroke="url(#magentaGradient)" stroke-width="1.5" opacity="0.5"/>
  <line x1="39" y1="64" x2="89" y2="64" stroke="url(#magentaGradient)" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Center Dot (Glowing) -->
  <circle cx="64" cy="64" r="8" fill="#2DD4FF" opacity="0.8" filter="url(#glow)"/>
</svg>